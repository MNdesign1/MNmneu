:root[data-theme=light]{--bg:#f6f2ea;--line:rgba(138,109,47,.3);--line2:rgba(28,26,23,.14);--text:#1c1a17;--muted:#6f695e;--dim:#7d776a;--gold:#8a6d2f;--gold2:#6b5120;--sel:rgba(138,109,47,.1);--hov:rgba(138,109,47,.05);--glass:rgba(246,242,234,.8);--glow:rgba(201,169,106,.22);--dot:138,109,47;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-weight:300;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;overflow-x:hidden;transition:background .5s,color .5s}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;left:50%;top:-20vh;width:120vw;height:80vh;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),transparent 70%);z-index:0;pointer-events:none;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55;transform:translateX(-50%) scale(1.08)}}

#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;background:var(--bg);cursor:pointer;transition:opacity 1.4s ease,visibility 1.4s}
#intro.gone{opacity:0;visibility:hidden}
#intro .enter{font-size:12px;letter-spacing:6px;color:var(--muted);opacity:0;animation:fade 1.6s 1.8s forwards,pulse 3s 3.4s ease-in-out infinite}
#intro .enter span{display:block;width:1px;height:38px;margin:0 auto 18px;background:linear-gradient(var(--gold),transparent)}
:root[lang=ar] #intro .enter,:root[lang=ar] .label,:root[lang=ar] button.send,:root[lang=ar] footer{letter-spacing:0}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{50%{opacity:.35}}

#ctrl{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:16px;z-index:11;display:flex;gap:8px}
#ctrl button{height:36px;min-width:36px;padding:0 12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(6px);color:var(--gold2);font:inherit;font-weight:400;font-size:12.5px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#ctrl button:focus-visible{outline:1px solid var(--gold)}
#ctrl svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}

.logo{background:var(--text);aspect-ratio:2.2792;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;transition:background .5s}
#intro .logo{width:170px;opacity:0;animation:rise 2.2s .3s cubic-bezier(.2,.7,.2,1) forwards}
header .logo{width:110px;margin:0 auto}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:72px 24px 40px}
.reveal{opacity:0;transform:translateY(18px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
body.in .reveal{opacity:1;transform:none}
body.in .d1{transition-delay:.5s}body.in .d2{transition-delay:.8s}body.in .d3{transition-delay:1.05s}body.in .d4{transition-delay:1.3s}
header{text-align:center;margin-bottom:60px}
header .rule{width:1px;height:46px;margin:28px auto 0;background:linear-gradient(var(--gold),transparent)}

.label{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--gold);letter-spacing:3px;margin-bottom:18px}
.label::after{content:"";flex:1;height:1px;background:var(--line)}
.section{margin-bottom:48px}

/* strips */
.strips{border:1px solid var(--line)}
.group+.group{border-top:1px solid var(--line)}
.strip{width:100%;display:flex;align-items:center;gap:12px;padding:18px 16px;background:transparent;border:0;color:var(--text);font:inherit;font-size:15px;font-weight:400;text-align:start;cursor:pointer;transition:background .35s,color .35s}
.strip:hover{background:var(--hov)}
.strip:focus-visible{outline:1px solid var(--gold);outline-offset:-4px}
.strip .t{flex:1;display:flex;flex-direction:column;gap:1px}
.strip .t small{font-size:11.5px;color:var(--dim);font-weight:300}
.strip .chev{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.6;transition:transform .4s}
.group.open .strip{color:var(--gold2)}
.group.open .chev{transform:rotate(180deg)}
.group.has .strip .t small{color:var(--gold)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.7,.2,1)}
.group.open .panel{grid-template-rows:1fr}
.panel>div{overflow:hidden}
.services{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.svc{position:relative;background:var(--bg)}
.svc:last-child:nth-child(odd){grid-column:span 2}
.svc input{position:absolute;opacity:0;pointer-events:none}
.svc label{display:flex;flex-direction:column;gap:2px;min-height:78px;justify-content:center;padding:14px 16px;cursor:pointer;transition:background .35s,color .35s}
.svc label b{font-weight:400;font-size:15px}
.svc label small{font-size:11.5px;color:var(--dim);transition:color .35s}
.svc label:hover{background:var(--hov)}
.svc input:checked+label{background:var(--sel);color:var(--gold2)}
.svc input:checked+label small{color:var(--gold)}
.svc input:checked+label::before{content:"";position:absolute;top:12px;inset-inline-start:12px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.svc input:focus-visible+label{outline:1px solid var(--gold);outline-offset:-4px}

.field{margin-bottom:30px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=tel],input[type=date],textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line2);padding:10px 0;color:var(--text);font:inherit;font-weight:400;font-size:16px;border-radius:0;transition:border-color .3s}
input:focus,textarea:focus{outline:none;border-bottom-color:var(--gold)}
textarea{min-height:44px;resize:vertical}
input[type=date]{min-height:46px}
#phone{direction:ltr;text-align:start}
:root[dir=rtl] #phone{text-align:right}
.err{color:#c46a6a;font-size:12px;margin-top:6px;display:none}
.field.bad .err{display:block}
.field.bad input{border-bottom-color:#c46a6a}
button.send{position:relative;width:100%;margin-top:14px;border:1px solid var(--gold);background:transparent;color:var(--gold2);font:inherit;font-weight:400;font-size:15px;letter-spacing:2px;padding:18px;cursor:pointer;overflow:hidden;transition:color .45s;z-index:0}
button.send::before{content:"";position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.2,.7,.2,1);z-index:-1}
:root[dir=rtl] button.send::before{transform-origin:left}
button.send:hover{color:var(--bg)}
button.send:hover::before{transform:scaleX(1)}
footer{text-align:center;color:var(--dim);font-size:11px;letter-spacing:4px;margin-top:64px}

#sound{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));inset-inline-start:22px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;opacity:0;transition:opacity 1s 1.5s}
body.in #sound{opacity:1}
#sound i{display:block;width:2px;height:12px;background:var(--gold);border-radius:1px;animation:eq 1.2s ease-in-out infinite}
#sound i:nth-child(2){animation-delay:.2s;height:18px}#sound i:nth-child(3){animation-delay:.4s}
#sound.off i{animation:none;height:3px;opacity:.6}
@keyframes eq{50%{transform:scaleY(.35)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal,#intro .logo,#intro .enter{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="glow"></div>

<div id="ctrl">
  <button id="langBtn" type="button" aria-label="Language">عربي</button>
  <button id="themeBtn" type="button" aria-label="Theme">
    <svg viewBox="0 0 24 24" id="themeIcon"></svg>
  </button>
</div>

<div id="intro" role="button" tabindex="0">
  <div class="logo" role="img" aria-label="MN"></div>
  <div class="enter" data-t="enter"><span></span><em style="font-style:normal"></em></div>
</div>

<main>
  <header class="reveal d1">
    <div class="logo" role="img" aria-label="MN"></div>
    <div class="rule"></div>
  </header>

  <form id="f" novalidate>
    <div class="section reveal d2">
      <div class="label" data-t="service"></div>
      <div class="strips" id="strips"></div>
    </div>

    <div class="section reveal d3">
      <div class="label" data-t="yourInfo"></div>
      <div class="field" id="fName">
        <label for="name" data-t="name"></label>
        <input type="text" id="name" autocomplete="name">
        <div class="err" data-t="errName"></div>
      </div>
      <div class="field" id="fPhone">
        <label for="phone" data-t="phone"></label>
        <input type="tel" id="phone" autocomplete="tel" inputmode="tel">
        <div class="err" data-t="errPhone"></div>
      </div>
      <div class="field">
        <label for="date" data-t="date"></label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label for="notes" data-t="notes"></label>
        <textarea id="notes" rows="1"></textarea>
      </div>
    </div>

    <div class="reveal d4">
      <button type="submit" class="send" data-t="send"></button>
    </div>
  </form>

  <footer class="reveal d4">MN</footer>
</main>

<button id="sound" aria-label="Music"><i></i><i></i><i></i></button>

<script>
// WhatsApp number, international format without + (example: 201012345678)
const WHATSAPP_NUMBER = "201090813285";

const $ = id => document.getElementById(id);
const store = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- Content (EN / AR) ---------- */
const T = {
  en:{enter:"Tap to enter",service:"Service",yourInfo:"Your details",name:"Name",phone:"Mobile number",date:"Event date (optional)",notes:"Details (optional)",send:"Send via WhatsApp",errName:"Enter your name",errPhone:"Enter a valid number",newOrder:"New order from MN",lSvc:"Service",lName:"Name",lPhone:"Mobile",lDate:"Event date",lNotes:"Details",services:"services"},
  ar:{enter:"اضغط للدخول",service:"الخدمة",yourInfo:"بياناتك",name:"الاسم",phone:"رقم الموبايل",date:"تاريخ المناسبة (اختياري)",notes:"تفاصيل (اختياري)",send:"إرسال عبر واتساب",errName:"اكتب اسمك",errPhone:"اكتب رقم صحيح",newOrder:"طلب جديد من MN",lSvc:"الخدمة",lName:"الاسم",lPhone:"الموبايل",lDate:"تاريخ المناسبة",lNotes:"تفاصيل",services:"خدمات"}
};
const GROUPS = [
  {en:"Invitations",ar:"دعوات",mood:0,items:[
    {en:["Wedding invitation","Countdown · location · RSVP"],ar:["دعوة فرح","عدّاد · لوكيشن · تأكيد حضور"]},
    {en:["Engagement & katb ketab","Elegant invite with the day's details"],ar:["خطوبة وكتب كتاب","دعوة أنيقة بتفاصيل اليوم"]},
    {en:["Birthday","For adults and kids"],ar:["عيد ميلاد","للكبار والأطفال"]},
    {en:["Newborn & sebou","Birth announcement and invite"],ar:["سبوع ومواليد","إعلان المولود ودعوة السبوع"]},
    {en:["Graduation party","For classmates and family"],ar:["حفلة تخرج","دعوات الدفعة والأهل"]},
    {en:["Events & conferences","Agenda · speakers · registration"],ar:["إيفنت ومؤتمرات","برنامج · متحدثين · تسجيل"]}]},
  {en:"Menus & Catalogs",ar:"منيو وكتالوجات",mood:1,items:[
    {en:["Restaurant & café menu","Sections · prices · photos"],ar:["منيو مطعم وكافيه","أقسام · أسعار · صور"]},
    {en:["Product catalog","For brands and shops"],ar:["كتالوج منتجات","للبراندات والمحلات"]},
    {en:["Company profile","About · services · work"],ar:["بروفايل شركة","تعريف · خدمات · أعمال"]}]},
  {en:"Cards & Links",ar:"كروت ولينكات",mood:2,items:[
    {en:["Business card","All your contacts in one QR"],ar:["كارت بزنس","كل وسائل التواصل في QR"]},
    {en:["Links page","One link for your bio"],ar:["صفحة لينكات","لينك واحد للبايو"]},
    {en:["Custom request","Tell us your idea"],ar:["طلب خاص","قولّنا فكرتك"]}]}
];

let lang = store.get('mn-lang') || 'en';
let theme = store.get('mn-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let selected = '0-0', openGroup = 0;
const chev = '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';

function buildStrips() {
  $('strips').innerHTML = GROUPS.map((g, gi) => {
    const hasSel = selected.split('-')[0] == gi;
    const selName = hasSel ? GROUPS[gi].items[+selected.split('-')[1]][lang][0] : `${g.items.length} ${T[lang].services}`;
    return `<div class="group${gi === openGroup ? ' open' : ''}${hasSel ? ' has' : ''}" data-g="${gi}">
      <button type="button" class="strip" aria-expanded="${gi === openGroup}"><span class="t">${g[lang]}<small>${selName}</small></span>${chev}</button>
      <div class="panel"><div><div class="services">${g.items.map((s, si) => `
        <div class="svc"><input type="radio" name="svc" id="s${gi}-${si}" value="${gi}-${si}"${selected === gi + '-' + si ? ' checked' : ''}><label for="s${gi}-${si}"><b>${s[lang][0]}</b><small>${s[lang][1]}</small></label></div>`).join('')}
      </div></div></div></div>`;
  }).join('');
}
$('strips').addEventListener('click', e => {
  const b = e.target.closest('.strip');
  if (!b) return;
  const gi = +b.parentElement.dataset.g;
  openGroup = openGroup === gi ? -1 : gi;
  document.querySelectorAll('.group').forEach((el, i) => {
    el.classList.toggle('open', i === openGroup);
    el.querySelector('.strip').setAttribute('aria-expanded', i === openGroup);
  });
  if (openGroup >= 0) playMood(GROUPS[gi].mood);
});
$('strips').addEventListener('change', e => {
  if (e.target.name !== 'svc') return;
  selected = e.target.value;
  const gi = +selected.split('-')[0];
  document.querySelectorAll('.group').forEach((el, i) => {
    el.classList.toggle('has', i === gi);
    const s = el.querySelector('.strip small');
    s.textContent = i === gi ? GROUPS[gi].items[+selected.split('-')[1]][lang][0] : `${GROUPS[i].items.length} ${T[lang].services}`;
  });
  playMood(GROUPS[gi].mood);
});

function applyLang() {
  const r = document.documentElement;
  r.lang = lang; r.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = T[lang][el.dataset.t];
    const em = el.querySelector('em'); (em || el).textContent = v;
  });
  $('langBtn').textContent = lang === 'ar' ? 'EN' : 'عربي';
  buildStrips();
  store.set('mn-lang', lang);
}
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name=theme-color]').content = theme === 'dark' ? '#080807' : '#f6f2ea';
  $('themeIcon').innerHTML = theme === 'dark'
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    : '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
  store.set('mn-theme', theme);
}
$('langBtn').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; applyLang(); });
$('themeBtn').addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); });
applyTheme(); applyLang();

/* ---------- Background particles ---------- */
(() => {
  const c = $('bg'), x = c.getContext('2d');
  let w, h, dpr, pts = [];
  const resize = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    pts = Array.from({length: Math.round(innerWidth * innerHeight / 22000) + 14}, () => ({
      x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.3 + .3) * dpr,
      v: (Math.random() * .12 + .04) * dpr, p: Math.random() * 6.28
    }));
  };
  resize(); addEventListener('resize', resize);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const tick = t => {
    x.clearRect(0, 0, w, h);
    const col = getComputedStyle(document.documentElement).getPropertyValue('--dot').trim();
    for (const p of pts) {
      p.y -= p.v; if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      const a = .18 + .22 * Math.sin(t / 1600 + p.p);
      x.beginPath(); x.arc(p.x + Math.sin(t / 3000 + p.p) * 6 * dpr, p.y, p.r, 0, 6.28);
      x.fillStyle = `rgba(${col},${a})`; x.fill();
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();

/* ---------- Music: 3 moods, one per strip (Web Audio) ---------- */
const MOODS = [
  {D:7, chords:[[50,57,64,66,69],[47,54,62,64,69],[43,50,59,62,66],[45,52,59,62,64]], bell:[74,76,78,81,83,86], lp:1800},   // Invitations: dreamy
  {D:6, chords:[[41,48,52,57,64],[45,52,55,60,64],[38,50,53,57,64],[43,50,55,59,64]], bell:[77,79,81,84,86], lp:2400},      // Menus: warm
  {D:5, chords:[[52,59,62,66,71],[48,55,59,64,67],[43,50,55,59,62],[50,57,62,64,69]], bell:[76,79,83,86,88], lp:3000}       // Cards: bright
];
let ctx, bus, cur = null, muted = false, started = false;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function initAudio() {
  if (ctx) return true;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  ctx = new AC();
  const len = ctx.sampleRate * 4, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  const verb = ctx.createConvolver(); verb.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = .55;
  const dry = ctx.createGain(); dry.gain.value = .6;
  bus = ctx.createBiquadFilter(); bus.type = 'lowpass'; bus.frequency.value = 1800;
  bus.connect(dry); bus.connect(verb); verb.connect(wet);
  dry.connect(ctx.destination); wet.connect(ctx.destination);
  return true;
}
function playMood(i) {
  if (!started || muted || !initAudio()) return;
  if (cur && cur.i === i) return;
  ctx.resume();
  const t0 = ctx.currentTime;
  if (cur) { // fade old mood out
    const old = cur; clearInterval(old.timer);
    old.g.gain.cancelScheduledValues(t0); old.g.gain.setValueAtTime(old.g.gain.value, t0); old.g.gain.linearRampToValueAtTime(0, t0 + 1.6);
    setTimeout(() => old.g.disconnect(), 5000);
  }
  const m = MOODS[i], g = ctx.createGain(); g.gain.value = 0; g.connect(bus);
  bus.frequency.setTargetAtTime(m.lp, t0, .5);
  g.gain.linearRampToValueAtTime(.9, t0 + 2.5);
  const pad = (n, t, dur, v) => {
    for (const det of [-6, 6]) {
      const o = ctx.createOscillator(), e = ctx.createGain();
      o.type = det < 0 ? 'sine' : 'triangle'; o.frequency.value = mtof(n); o.detune.value = det;
      e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(v, t + 2); e.gain.setValueAtTime(v, t + dur - 1.8); e.gain.linearRampToValueAtTime(0, t + dur + 1.5);
      o.connect(e); e.connect(g); o.start(t); o.stop(t + dur + 1.6);
    }
  };
  const ping = (n, t) => {
    const o = ctx.createOscillator(), e = ctx.createGain();
    o.type = 'sine'; o.frequency.value = mtof(n);
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(.05, t + .02); e.gain.exponentialRampToValueAtTime(.0001, t + 3.2);
    o.connect(e); e.connect(g); o.start(t); o.stop(t + 3.3);
  };
  let bar = 0, next = t0 + .1;
  const schedule = () => {
    while (next < ctx.currentTime + m.D * 2) {
      m.chords[bar % m.chords.length].forEach((n, k) => pad(n, next, m.D, k === 0 ? .05 : .022));
      const pings = Math.round(m.D / 2);
      for (let k = 0; k < pings; k++) if (Math.random() < .7) ping(m.bell[Math.floor(Math.random() * m.bell.length)], next + .6 + k * 2 + Math.random() * .6);
      next += m.D; bar++;
    }
  };
  schedule();
  cur = {i, g, timer: setInterval(schedule, 2000)};
  $('sound').classList.remove('off');
}
function toggleMusic() {
  if (!started) return;
  if (muted) { muted = false; const i = openGroup >= 0 ? GROUPS[openGroup].mood : 0; cur = null; playMood(i); return; }
  muted = true; $('sound').classList.add('off');
  if (cur) { const t = ctx.currentTime; clearInterval(cur.timer); cur.g.gain.cancelScheduledValues(t); cur.g.gain.setValueAtTime(cur.g.gain.value, t); cur.g.gain.linearRampToValueAtTime(0, t + .8); const old = cur; cur = null; setTimeout(() => old.g.disconnect(), 3000); }
}
$('sound').addEventListener('click', toggleMusic);

/* ---------- Enter ---------- */
function enter() {
  if (document.body.classList.contains('in')) return;
  started = true;
  $('intro').classList.add('gone');
  document.body.classList.add('in');
  try { playMood(GROUPS[openGroup < 0 ? 0 : openGroup].mood); } catch (e) {}
}
$('intro').addEventListener('click', enter);
$('intro').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });

/* ---------- Send order via WhatsApp ---------- */
$('f').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('name').value.trim(), phone = $('phone').value.trim();
  const okName = name.length > 1, okPhone = /^[+\d\s-]{8,}$/.test(phone);
  $('fName').classList.toggle('bad', !okName);
  $('fPhone').classList.toggle('bad', !okPhone);
  if (!okName) return $('name').focus();
  if (!okPhone) return $('phone').focus();
  const [gi, si] = selected.split('-').map(Number);
  const svc = GROUPS[gi].items[si][lang][0], L = T[lang];
  const date = $('date').value, notes = $('notes').value.trim();
  let msg = `${L.newOrder}\n\n${L.lSvc}: ${svc}\n${L.lName}: ${name}\n${L.lPhone}: ${phone}`;
  if (date) msg += `\n${L.lDate}: ${date}`;
  if (notes) msg += `\n${L.lNotes}: ${notes}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
});
</script>
</body>
</html>
